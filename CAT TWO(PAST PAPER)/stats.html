<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet Usage Statistics - KNBS</title>
    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px auto;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #999;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #d1e7dd; /* Shaded header row */
        }
        caption {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <table>
        <caption>Kenya Internet Usage Statistics</caption>
        <thead>
            <tr>
                <th>County</th>
                <th>Internet Users (millions)</th>
                <th>% Penetration</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Nairobi</td>
                <td>6.2</td>
                <td>72%</td>
            </tr>
            <tr>
                <td>Mombasa</td>
                <td>1.8</td>
                <td>55%</td>
            </tr>
            <tr>
                <td>Kisumu</td>
                <td>0.9</td>
                <td>41%</td>
            </tr>
            <tr>
                <td>Nakuru</td>
                <td>1.1</td>
                <td>48%</td>
            </tr>
            <tr>
                <td>Eldoret</td>
                <td>0.7</td>
                <td>39%</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
